name: Deploy HTML Website to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Website Files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SECRETKKU }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./"
          target: "/www/wwwroot/kkucakes.run.place"
          overwrite: true
          rm: false
          exclude: ".git*,.github/**"

      - name: Set Website Permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SECRETKKU }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo chown -R www:www /www/wwwroot/kkucakes.run.place
            sudo find /www/wwwroot/kkucakes.run.place -type d -exec chmod 755 {} \;
            sudo find /www/wwwroot/kkucakes.run.place -type f -exec chmod 644 {} \;

      - name: Deployment Completed
        run: echo "Website deployment completed successfully!"
